name: Auto Fetch Price
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  run-crawler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install psycopg2-binary
      - run: python crawler.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
